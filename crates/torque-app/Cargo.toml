[package]
name = "torque-app"
description = "What a game made on the torque-rs engine shares: its files, a server, a client, a window, the world view and offscreen pictures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "game-engine", "gamedev"]
categories = ["game-engines", "game-development"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

# Needs a GPU: the drawing crates, the window and the pictures' encoder. The umbrella crate re-exports it as `torque::app`
# (its `app` feature).

[dependencies]
glam = { workspace = true }
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
# The audio plugin and the world's sounds on its mixer; the sound card itself behind the `audio-device` feature.
torque-audio = { path = "../torque-audio", features = ["engine"] }
torque-client = { path = "../torque-client", features = ["window"] }
torque-collide = { path = "../torque-collide" }
# The content formats' loaders in `DefaultPlugins` (`ContentFormatPlugins`).
torque-content = { path = "../torque-content" }
torque-fonts = { path = "../torque-fonts", features = ["system-fonts"] }
# The plugins that wire a server's and a client's script engine.
torque-engine = { path = "../torque-engine" }
# The server half: the files, the server, the water block, the dedicated runner and the server plugins.
torque-app-server = { path = "../torque-app-server" }
torque-game = { path = "../torque-game" }
torque-ghost-world = { path = "../torque-ghost-world" }
torque-ghosts = { path = "../torque-ghosts" }
torque-gui = { path = "../torque-gui" }
# The interiors' map importers and surfaces.
torque-mapcore = { path = "../torque-mapcore" }
torque-maps = { path = "../torque-maps" }
torque-render-core = { path = "../torque-render-core" }
torque-render-hd = { path = "../torque-render-hd" }
torque-render-scene = { path = "../torque-render-scene" }
torque-net = { path = "../torque-net" }
torque-server = { path = "../torque-server" }
torque-shapes = { path = "../torque-shapes" }
# A Player's swim pose.
torque-sim = { path = "../torque-sim" }
# The page bridge's syntax check of the page's script text.
torque-ts-compiler = { path = "../torque-ts-compiler" }
torque-ts-text = { path = "../torque-ts-text" }
torque-ts-vm = { path = "../torque-ts-vm" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
png = "0.18"
# The page bridge's JSON.
serde_json = "1.0.140"
# The client builder's error type (`ClientError`).
thiserror = { workspace = true }

# The QUIC link (the `quic` feature, never on the web): the client endpoint, the server's identity pinned or trusted on
# first use.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
torque-net-quic = { path = "../torque-net-quic", optional = true }

# In a browser: the canvas's device is asked for without blocking; the page's address and root element, a panic shown in its
# console.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# The page bridge's calls to the page's handlers and its answers to the page's requests.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "History", "Location", "Window"] }

[features]
default = ["renderer", "gizmos", "quic"]
# The engine's renderer on the renderer slot and its feature plugins (`RendererPlugin`, `RenderFeaturePlugins`), in
# `DefaultPlugins`. Without it a game registers its own renderers on the slot.
renderer = []
# Debug gizmos: `GizmosPlugin`'s lines, boxes, spheres, arrows, crosses and labels, and the pass that draws them. Without it the
# plugin only registers the console functions as ones that do nothing: leave it out of a shipped build.
gizmos = ["torque-render-hd/gizmos"]
# The `.map` loader in `ContentFormatPlugins` (added off): a Quake or Valve 220 `.map` built into an interior by
# torque-interior-builder, which builds no other way into a client.
map-builder = ["torque-content/map-builder"]
# Browsers as players: a server listening on the web (`Listen::Web`) and a client's game socket over WebSocket.
web = ["torque-app-server/web", "torque-server/web", "torque-client/web-socket"]
# Browsers on WebRTC data channels beside their game sockets (the server's `WebSetup::rtc`, the client's `web_rtc`).
webrtc = ["web", "torque-app-server/webrtc", "torque-server/webrtc", "torque-client/webrtc"]
# Player-hosted games through a room service: a server on a player's host transport (`Listen::Bound` with torque-server's
# `net::web::p2p`) and a client's datagrams to it (torque-client's `net::room_join`).
p2p = ["webrtc", "torque-app-server/p2p", "torque-server/p2p", "torque-client/p2p"]
# Desktop players over QUIC: a server listening on the QUIC link (`Listen::Quic`) and a client's socket over it
# (`QuicTarget`), the server known by the hash of its identity key. In the engine's protocol it is what UDP means on both
# ends (`Listen::Udp`, `ClientNet::Loopback` and `Lan`), so a game's server and client builds take it together. Natively
# only: a browser build compiles none of it.
quic = ["torque-app-server/quic", "dep:torque-net-quic"]
# The window opens the default sound card for the client's mixer (cpal; ALSA on Linux); without a device, or without this
# feature, the mixer runs on the clock and nothing is heard.
audio-device = ["torque-audio/device"]

# `testing`: `Rig` and `TgeOnlyClient`, the net tests' server and clients over the memory transport, which the plugin crates'
# tests share. Only dev-dependencies enable it.
testing = ["torque-game/testing"]

[dev-dependencies]
# The scripted input source of the input-source tests (`FakeInput`).
torque-client = { path = "../torque-client", features = ["testing"] }
# The tests' synthetic interiors and terrain (`torque_maps::synth`).
torque-maps = { path = "../torque-maps", features = ["testing"] }
# The tests' synthetic shapes (`torque_shapes::synth`).
torque-shapes = { path = "../torque-shapes", features = ["testing"] }
# The seeded random source and the rounds of the server fuzz.
torque-testkit = { path = "../torque-testkit" }
# The script test helpers (`torque_ts_vm::testing`).
torque-ts-vm = { path = "../torque-ts-vm", features = ["testing"] }
criterion = { workspace = true }
# The interiors bench's yards.
torque-interior-builder = { path = "../torque-interior-builder" }
# The hashes the web page tests check the files against.
sha2 = "0.10"

[[bench]]
name = "app"
harness = false

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
