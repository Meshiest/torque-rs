[package]
name = "torque-app"
description = "What a game made on the torque-rs engine shares: its files, a server, a client, a window, the world view and offscreen pictures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "game-engine", "gamedev"]
categories = ["game-engines", "game-development"]

# Needs a GPU: the drawing crates, the window and the pictures' encoder. The umbrella crate re-exports it as `torque::app`
# (its `app` feature).

[dependencies]
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
torque-client = { path = "../torque-client", features = ["window"] }
torque-collide = { path = "../torque-collide" }
torque-fonts = { path = "../torque-fonts", features = ["system-fonts"] }
torque-game = { path = "../torque-game" }
torque-ghost-world = { path = "../torque-ghost-world" }
torque-ghosts = { path = "../torque-ghosts" }
torque-gui = { path = "../torque-gui" }
# A TerrainBlock's file and its heightfield.
torque-mapcore = { path = "../torque-mapcore" }
torque-maps = { path = "../torque-maps" }
torque-render-core = { path = "../torque-render-core" }
torque-render-hd = { path = "../torque-render-hd" }
torque-render-scene = { path = "../torque-render-scene" }
torque-server = { path = "../torque-server" }
torque-shapes = { path = "../torque-shapes" }
torque-ts-text = { path = "../torque-ts-text" }
torque-ts-vm = { path = "../torque-ts-vm" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
png = "0.18"

# In a browser: the canvas's device is asked for without blocking.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[features]
# Browsers as players: a server listening on the web (`Listen::Web`) and a client's game socket over WebSocket.
web = ["torque-server/web", "torque-client/web-socket"]

[lints]
workspace = true
