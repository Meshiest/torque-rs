[package]
name = "torque-fonts"
description = "Font caches, glyph metrics and text layout for torque-rs GUIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "font", "glyph", "text", "gamedev"]
categories = ["game-development", "text-processing"]

# GUI fonts: the `.uft` font caches TGE 1.4's GFont writes, the glyph metrics, `getStrNWidth` and `dglDrawTextN`'s glyph layout
# over UTF-16 code units; the fallback rasterizer for a face and size without a cache file behind a trait. No script VM, no GPU.
# A cache file is hostile input: a value or an error, never a panic, every allocation capped.

[dependencies]
torque-images = { path = "../torque-images" }
# The zlib inflate of a `.uft`'s remap.
miniz_oxide = "0.8"
# The rasterizer of `ttf` (the TrueType faces a host serves) and of the fallback (a face
# and size with no cache file: the system's font of that name; feature `system-fonts`, off by default).
fontdue = "0.9.3"
# The cmap lookups `ttf::check` makes once it has bounded them (the version fontdue reads the file with).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[features]
system-fonts = []

[dev-dependencies]
# The fuzz seeds' sheets are encoded with the same crate the decoder sits on.
png = "0.18"

[lints]
workspace = true
