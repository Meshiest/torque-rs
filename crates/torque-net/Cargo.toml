[package]
name = "torque-net"
description = "Torque-style client/server networking: bit streams, packets, events, ghosting and string compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "networking", "ghosting", "netcode", "gamedev"]
categories = ["network-programming", "game-development"]

# Torque-style networking, server side: the bit layer, the Huffman and string coders, the packet layer, the handshake, events,
# commands and the ghost manager, as pure state machines over traits. Std only, no dependency at all: the glue that owns the
# socket and the scripts, and the payload codecs of the objects, live in the host.
# Every decoder reads hostile bytes: it returns a value or a `NetError`, never panics, and allocates only through `cap`.

