[package]
name = "torque-net"
description = "Torque-style client/server networking: bit streams, packets, events, ghosting and string compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "networking", "ghosting", "netcode", "gamedev"]
categories = ["network-programming", "game-development"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

# Torque-style networking, server side: the bit layer, the Huffman and string coders, the packet layer, the handshake, events,
# commands and the ghost manager, as pure state machines over traits. Std only, no dependency but `torque-bytes`: the glue that owns the
# socket and the scripts, and the payload codecs of the objects, live in the host.
# Every decoder reads hostile bytes: it returns a value or a `NetError`, never panics, and allocates only through `cap`.

[dependencies]
torque-bytes = { path = "../torque-bytes" }

[dev-dependencies]
# The seeded random source, the byte mutators and the fuzz rounds of the tests.
torque-testkit = { path = "../torque-testkit" }
# The digests of the wire goldens.
sha2 = "0.10"
# The benches.
criterion = { workspace = true }
# The engine session bench's allocation counts.
stats_alloc = { workspace = true }

[[bench]]
name = "ghost_section"
harness = false

[[bench]]
name = "bits"
harness = false

[[bench]]
name = "engine_session"
harness = false

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
