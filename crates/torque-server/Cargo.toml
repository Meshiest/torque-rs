[package]
name = "torque-server"
description = "The torque-rs dedicated server's engine side: the machine the natives report, the main loop's pacing and the datagram transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "server", "networking", "gamedev"]
categories = ["game-development", "network-programming"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

# The dedicated server's engine side: the machine and the network the natives report, the main loop's pacing, the datagram
# transport with its bind policy, and the seam between the packet layer and what rides in the packets.

[dependencies]
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
torque-ts-vm = { path = "../torque-ts-vm" }
# The WebSocket accept key's base64.
torque-bytes = { path = "../torque-bytes" }
# The packet layer: datagram caps, the server query's request types, the bit streams.
torque-net = { path = "../torque-net" }
# The plugin registry the channels are added to.
torque-engine = { path = "../torque-engine" }
# The datablocks' computed values a game's record writer reads beside the host's view.
torque-game = { path = "../torque-game" }
# TGE's networked class lists, the default class table of a server's codecs; the net strings a ghost record packs.
torque-ghosts = { path = "../torque-ghosts" }
# The scope eye's transform the ghost hub keeps.
torque-collide = { path = "../torque-collide" }

# The container bins of the game classes' container.
torque-scene = { path = "../torque-scene" }
# The simulated Player's state a control object's packet data is written from.
torque-sim = { path = "../torque-sim" }
# The simulated vehicles' state their records and packet data are written from.
torque-vehicle = { path = "../torque-vehicle" }

# The web transport (the `web` feature, never on the web itself): WebSocket framing with no handshake of its own, the
# HTTP request heads, the handshake's hash, and TLS through rustls with the ring provider.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, optional = true }
# The files the HTTP side serves are read without following a link, within a cap.
torque-resource = { path = "../torque-resource", optional = true }
httparse = { version = "1.10", optional = true }
sha1 = { version = "0.11", optional = true }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# WebRTC data channels beside the web transport (the `webrtc` feature): ICE, DTLS and SCTP with no I/O of their own, driven
# by the server's passes, with the aws-lc crypto backend (constant-time; its certificate maker needs it anyway).
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"], optional = true }
# The data channels' ICE credentials, from the system's random source (the TLS provider's).
ring = { version = "0.17", default-features = false, optional = true }

[features]
# The web transport: HTTP and WebSocket on one port, and UDP beside it (`net::web`).
web = ["dep:torque-resource", "dep:tungstenite", "dep:httparse", "dep:sha1", "dep:rustls"]
# WebRTC data channels for the web transport's browsers, signaled over their game sockets (`net::web::rtc`).
webrtc = ["web", "dep:str0m", "dep:ring"]
# The room protocol (`net::room`): how a player who hosts a game and the players who join it find each other through a room
# service. Text only, no dependencies (a browser's joiner uses it too).
rooms = []
# A player's host (`net::web::p2p`): players join over data channels found through a room service, with no port forwarded.
p2p = ["webrtc", "rooms"]

[dev-dependencies]
# A `Vm` with the game classes installed (`torque_game::testing::vm`).
torque-game = { path = "../torque-game", features = ["testing"] }
# The benches.
criterion = { workspace = true }
# The web transport's TLS tests: a certificate made for the test.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# The web transport's tests: the client's side of TLS and of the WebSocket.
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", default-features = false }
# The web transport's TLS tests: a client's records sealed by hand (key updates and empty records no TLS library sends).
ring = { version = "0.17", default-features = false }
# The tests' shapes (a box a Player stands in).
torque-shapes = { path = "../torque-shapes" }
# The hitbox tests' figure: bones with a box each.
torque-shape-builder = { path = "../torque-shape-builder" }
# The live datablock tests' wheeled vehicle: a buggy with four hub nodes.
torque-example-assets = { path = "../../examples/assets" }
# The interior tests' wall, built from brushes.
torque-interior-builder = { path = "../torque-interior-builder" }
# The plugin class tests: an engine whose plugin adds a ghost class, and the client's ghost codec that reads it.
torque-engine = { path = "../torque-engine" }
torque-ghost-world = { path = "../torque-ghost-world" }

[[bench]]
name = "ghost_tick"
harness = false

# `web` and `rtc` in it are behind their features.
[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
