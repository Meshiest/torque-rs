[package]
name = "torque-resource"
description = "The torque-rs resource layer: a game folder read-only, its zips mounted as folders and the scripts' writes in memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "resources", "zip", "gamedev"]
categories = ["game-development", "filesystem"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

# The resource layer: a game folder read-only, its zips mounted as folders, the scripts' writes in memory. The script engine's
# FileHost is what it serves.

[dependencies]
torque-ts-vm = { path = "../torque-ts-vm" }
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# `O_NOFOLLOW`, to open a file without following a link; `fcntl` to clear `O_NONBLOCK` on the file once it is checked.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
# The CRC-32 of the hand-made archives' entries.
torque-bytes = { path = "../torque-bytes" }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
