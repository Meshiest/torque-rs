[package]
name = "torque-collide"
description = "Collision for torque-rs: convexes, GJK, polygon lists and working sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "collision", "gjk", "physics", "gamedev"]
categories = ["game-development", "simulation", "mathematics"]

# The collision library: Torque's convexes, GJK and polygon lists, with explicit f32 rounding points in its math. Std,
# torque-scene's plain math and a fast hash only; queries reach the world through a trait the host implements, so the
# simulation and vehicle crates share it.

[dependencies]
# The format-neutral map layer the map collision reads.
torque-mapcore = { path = "../torque-mapcore" }
# The hash of the engine's own ids in the movers' hot maps (`hash`).
rustc-hash = { workspace = true }
# The engine's plain vector, quaternion and matrix arithmetic, the transcendentals and the finite-value guards (`math`), and
# the budget error (`Exhausted`).
torque-scene = { path = "../torque-scene" }

[features]
# `testing::BoxWorld`, a `World` of axis-aligned boxes for the tests of the movers built on this crate. Only dev-dependencies enable it.
testing = []

[dev-dependencies]
# This crate's own integration tests use `testing`.
torque-collide = { path = ".", features = ["testing"] }
# The Torque map importer and synthetic files for the map collision's tests.
torque-maps = { path = "../torque-maps", features = ["testing"] }

[lints]
workspace = true
