[package]
name = "torque-collide"
description = "Collision for torque-rs: convexes, GJK, polygon lists and working sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "collision", "gjk", "physics", "gamedev"]
categories = ["game-development", "simulation", "mathematics"]

# The collision library: Torque's convexes, GJK and polygon lists, with explicit f32 rounding points in its math. Std only;
# queries reach the world through a trait the host implements, so the simulation and vehicle crates share it.

[dependencies]
# The format-neutral map layer the map collision reads.
torque-mapcore = { path = "../torque-mapcore" }

[dev-dependencies]
# The Torque map importer and synthetic files for the map collision's tests.
torque-maps = { path = "../torque-maps" }

[lints]
workspace = true
