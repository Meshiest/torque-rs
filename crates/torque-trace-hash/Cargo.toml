[package]
name = "torque-trace-hash"
description = "A reusable determinism harness: scripted 600-tick runs of the predicted paths hashed into one value, the same on native and wasm32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "determinism", "testing", "wasm"]
categories = ["game-development", "development-tools::testing"]
default-run = "trace-hash"

# Each scenario runs a server (`MinimalPlugins` and the plugin under test) and a client over an in-memory link for 600 ticks,
# feeds the client scripted inputs, and hashes the server's and the client's per-tick state; the Rapier world's scenario steps
# that world alone (the core a server's props and a client's prediction share). The `trace-hash` binary prints
# one line per scenario; CI runs it natively and as wasm32-wasip1 (`web/trace-hash.mjs`) and compares the two outputs.
# Nothing here draws or opens a window, so the crate builds for both targets.

[dependencies]
torque-app-server = { path = "../torque-app-server" }
torque-client = { path = "../torque-client" }
torque-collide = { path = "../torque-collide" }
torque-engine = { path = "../torque-engine" }
torque-plugin-smooth-prediction = { path = "../torque-plugin-smooth-prediction" }
torque-game = { path = "../torque-game" }
torque-gui = { path = "../torque-gui" }
# The hills and the keep read for the Rapier world's scenario, and the world itself.
torque-maps = { path = "../torque-maps" }
torque-physics-rapier = { path = "../torque-physics-rapier" }
# The props scenario's plugin.
torque-plugin-props = { path = "../torque-plugin-props" }
# The hierarchy scenario's tree (the plugin itself is in `MinimalPlugins`).
torque-plugin-hierarchy = { path = "../torque-plugin-hierarchy" }
torque-server = { path = "../torque-server" }
torque-shapes = { path = "../torque-shapes" }
torque-ts-vm = { path = "../torque-ts-vm" }
# The floor, the figure and the buggy the scenarios run on.
torque-example-assets = { path = "../../examples/assets" }

# The wire goldens (`tests/wire_golden.rs`) run whole engines against each other: a mods download, a plugin's ghosts, the refusals.
# The dev-dependencies are for tests only, so the wasm32 build of the binary never sees them.
[dev-dependencies]
sha2 = "0.10"
torque = { path = "../torque", default-features = false, features = ["app", "mods"] }
torque-example-minimal-engine = { path = "../../examples/minimal-engine" }
torque-plugin-rope = { path = "../torque-plugin-rope" }
# A test's body solver: TGE's behind a counter.
torque-vehicle = { path = "../torque-vehicle" }
# The benches (`benches/`): a whole server tick, and a predicting client's tick with replays.
criterion = { workspace = true }
stats_alloc = { workspace = true }

[[bin]]
name = "trace-hash"
path = "src/main.rs"

# The cost of a client's prop replay (8 props x 46 moves), natively and as wasm32-wasip1.
[[bin]]
name = "replay-bench"
path = "src/bin/replay_bench.rs"

[[bench]]
name = "server"
harness = false

[[bench]]
name = "client"
harness = false

[lints]
workspace = true
