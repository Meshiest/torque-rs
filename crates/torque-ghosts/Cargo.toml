[package]
name = "torque-ghosts"
description = "Torque-style networked objects: the ghost record codecs, the class registry and the parent parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "networking", "ghosting", "netcode", "gamedev"]
categories = ["network-programming", "game-development"]

# The engine's networked-object layer: the record codec framework (one layout per record, run by an encoder, a decoder or a
# logging encoder), the connection's id widths, the client's facts a decoder asks, the class registry, the host's object
# views, the parent parts and the engine's own layouts. Std only beyond `torque-net`.

[dependencies]
torque-bytes = { path = "../torque-bytes" }
torque-net = { path = "../torque-net" }

[features]
# `testing::MapView`, an `ObjectView` over maps, for the tests of crates that pack or decode records. Only dev-dependencies enable it.
testing = []

[dev-dependencies]
# The seeded random source of the hostile-input tests.
torque-testkit = { path = "../torque-testkit" }

[lints]
workspace = true
