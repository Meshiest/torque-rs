[package]
name = "torque-render-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The renderers' device layer: the wgpu adapter, device and queue (`Gpu`), the backends and their order, the sample counts,
# offscreen and window targets, the frame read back, and the GUI pass with its backdrop blur.

[dependencies]
# The GUI pass draws `torque-gui`'s draw lists (plain data; `torque-gui` itself has no wgpu).
torque-gui = { path = "../torque-gui" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }
pollster = "0.4"

# In a browser: WebGPU, its handles Send and Sync as the native ones are (the page has one thread: no wasm threads are used).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "gui_pass"
harness = false

# The workspace's lints (`[workspace.lints]`), copied: a crate that inherits them cannot change one, and `forbid` cannot be
# lowered by an `allow`. The one change is `unsafe_code`, so that the pipeline cache's one `unsafe` block can be expected
# where it is. The test `the_lints_are_the_workspaces` (src/lib.rs) fails when the copy and the workspace's differ.
[lints.rust]
# `deny`, not the workspace's `forbid`: one function (`pipeline_cache::create`) expects it, for its one `unsafe` block.
unsafe_code = "deny"
non_ascii_idents = "forbid"
explicit_outlives_requirements = "warn"
keyword_idents = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.clippy]
# Left-over debugging and placeholders.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Idioms.
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
manual_assert = "warn"
manual_is_variant_and = "warn"
manual_ok_or = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
should_panic_without_expect = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
string_lit_chars_any = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnested_or_patterns = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
# Process control belongs to the host, never to a library.
exit = "warn"
mem_forget = "warn"
