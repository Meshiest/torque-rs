[package]
name = "torque-maps"
description = "Readers for Torque interior, terrain and material-list files, imported into the torque-rs map layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "interior", "terrain", "map", "gamedev"]
categories = ["game-development", "parser-implementations"]

# Torque's legacy map files: `.dif` interiors, `.ter` terrains and `.dml` material
# lists read as data. Std only: these files come from servers and download sites, so the readers are
# fuzzed alone. `legacy` is the importer that makes them into the format-neutral map layer (`torque-mapcore`, std only too),
# which hosting, collision and drawing read.

[dependencies]
torque-mapcore = { path = "../torque-mapcore" }

[lints]
workspace = true
