[package]
name = "torque-macros"
description = "Attribute and derive macros for the engine: Rust functions as TorqueScript natives, and plugin ids"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "macros", "proc-macro", "torquescript"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
torque-macros-core = { path = "../torque-macros-core" }

[dev-dependencies]
# Compiles small programs that use the macros and compares the compiler's answer (`tests/ui`).
trybuild = "1"
# What `#[derive(PluginId)]` implements, for its `tests/ui` cases.
torque-engine = { path = "../torque-engine" }

[lints]
workspace = true
