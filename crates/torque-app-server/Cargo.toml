[package]
name = "torque-app-server"
description = "The server half of torque-app: a game's files, its server (UDP, memory or web), the terrain and water blocks, the dedicated runner and MinimalPlugins, with no drawing, GUI, audio or window crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "game-engine", "server", "gamedev"]
categories = ["game-engines", "game-development"]

# Nothing here draws, plays sound or opens a window: `cargo tree -p torque-app-server` has none of those crates (CI checks it).
# `torque-app` re-exports every module as its own.

[dependencies]
torque-bytes = { path = "../torque-bytes" }
torque-net = { path = "../torque-net" }
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
torque-collide = { path = "../torque-collide" }
# The content formats' loaders (`ContentFormatPlugins`, in `MinimalPlugins`): glTF shapes, `.dif`, `.ter` and the map layer.
torque-content = { path = "../torque-content" }
torque-engine = { path = "../torque-engine" }
torque-game = { path = "../torque-game" }
# The scene hierarchy (`HierarchyPlugin`, in `MinimalPlugins`; on in engine mode).
torque-plugin-hierarchy = { path = "../torque-plugin-hierarchy" }
# Local mods (`ModsPlugin`, in `MinimalPlugins`): folders and zips mounted over the game's files.
torque-mods = { path = "../torque-mods" }
# Every file of a game folder is read without following a link, within a cap.
torque-resource = { path = "../torque-resource" }
# A TerrainBlock's file and its heightfield.
torque-mapcore = { path = "../torque-mapcore" }
torque-maps = { path = "../torque-maps" }
torque-server = { path = "../torque-server" }
# The water zone a Player swims in.
torque-sim = { path = "../torque-sim" }
torque-ts-vm = { path = "../torque-ts-vm" }
# The list of a web build's files (`manifest`): its JSON and its files' hashes.
serde_json = "1.0.140"
# `game.toml`, the game's config (`config`): read strictly, with a size cap.
serde = { version = "1.0.219", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
sha2 = "0.10"

# The QUIC link (the `quic` feature, never on the web): the server endpoint, its identity key and the ticket binding.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
torque-net-quic = { path = "../torque-net-quic", default-features = false, optional = true }

[features]
# Browsers as players: a server listening on the web (`Listen::Web`).
web = ["torque-server/web"]
# Browsers on WebRTC data channels beside their game sockets (the server's `WebSetup::rtc`).
webrtc = ["web", "torque-server/webrtc"]
# Player-hosted games through a room service: a server on a player's host transport (`Listen::Bound` with torque-server's
# `net::web::p2p`).
p2p = ["webrtc", "torque-server/p2p"]
# Desktop players over QUIC: a server listening on the QUIC link (`Listen::Quic`), with its identity key.
quic = ["dep:torque-net-quic"]
# `testing`: doubles for the tests of crates that run a server (a net game of Torque's parts). Only dev-dependencies enable it.
testing = []

[dev-dependencies]
# `ClosurePlugin`, the plugin of a test.
torque-engine = { path = "../torque-engine", features = ["testing"] }
# The AIPlayer test's floor and figure.
torque-example-assets = { path = "../../examples/assets" }
torque-shapes = { path = "../torque-shapes" }

[lints]
workspace = true
