[package]
name = "torque-plugin-rope"
description = "A rope plugin for torque-rs: a RopeData datablock, ropes a script makes, simulated and drawn as lit tubes with shadows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "rope", "physics", "plugin", "gamedev"]
categories = ["game-development"]

# A client-side rope: the `RopeData` datablock class and the `rope*` console functions (torque-engine's script registry), a
# position-based simulation run once per client tick, and render passes (torque-app's `render()` registry): the tubes into
# the opaque frame and into the sun's shadow cascades, and the ribbons and lines over the translucent surfaces.

[dependencies]
glam = { workspace = true }
torque-app = { path = "../torque-app", default-features = false }
torque-engine = { path = "../torque-engine" }
torque-render-core = { path = "../torque-render-core" }
torque-render-hd = { path = "../torque-render-hd" }
torque-images = { path = "../torque-images" }
torque-render-scene = { path = "../torque-render-scene" }
torque-ts-text = { path = "../torque-ts-text" }
torque-ts-vm = { path = "../torque-ts-vm" }

[dev-dependencies]
# The engine's renderer, to draw the ropes in the pictures' tests.
torque-app = { path = "../torque-app", features = ["renderer"] }
# The tick the simulation steps by is the server's.
torque-server = { path = "../torque-server" }

[lints]
workspace = true
