[package]
name = "torque-bundle"
description = "Packages a game made on torque-rs: its binaries with the plugins its game.toml keeps, its files, its extensions, the licenses of what it links and a manifest of hashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "packaging", "bundle", "gamedev"]
categories = ["game-development", "development-tools::build-utils"]

# A build tool: it runs cargo and rustc, reads the game's folder and writes a bundle folder. It links none of the running engine
# (no server, client, renderer or window): only the resource layer's no-follow file reader and the readers of the engine's file
# formats, which open every asset of the game folder under their caps, and the script compiler, so it builds without a GPU.
# `just bundle <game crate>` runs it.

[dependencies]
aho-corasick = "1"
# The no-follow, capped reader of a file (`--verify` reads a bundle from elsewhere).
torque-bytes = { path = "../torque-bytes" }
torque-resource = { path = "../torque-resource" }
# The readers the game folder's assets are opened with (`validate`), and the compiler and the code loader of the scripts
# (`precompile`).
torque-audio = { path = "../torque-audio" }
torque-fonts = { path = "../torque-fonts" }
torque-images = { path = "../torque-images" }
torque-import = { path = "../torque-import" }
torque-maps = { path = "../torque-maps" }
torque-shapes = { path = "../torque-shapes" }
torque-ts-bytecode = { path = "../torque-ts-bytecode" }
torque-ts-compiler = { path = "../torque-ts-compiler" }
torque-ts-vm = { path = "../torque-ts-vm" }
memchr = "2.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# The leak scan looks inside the zips of a game folder, and the tests read the bundle's own archive back.
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The constants of the mods plugin that `validate` and `precompile` repeat, held equal by a test (the tool does not link it).
[dev-dependencies]
torque-mods = { path = "../torque-mods" }

[lints]
workspace = true
