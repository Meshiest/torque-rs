[package]
name = "torque-client"
description = "The torque-rs client's engine half: the connection to a server, the record world's prediction, the action maps, the server query and the window glue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "client", "networking", "gamedev"]
categories = ["game-development", "network-programming"]

[dependencies]
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
torque-scene = { path = "../torque-scene" }
torque-game = { path = "../torque-game" }
torque-server = { path = "../torque-server" }
ghost-world = { path = "../torque-ghost-world", package = "torque-ghost-world" }
net = { path = "../torque-net", package = "torque-net" }
ghosts = { path = "../torque-ghosts", package = "torque-ghosts" }
collide = { package = "torque-collide", path = "../torque-collide" }
sim = { package = "torque-sim", path = "../torque-sim" }
shapes = { package = "torque-shapes", path = "../torque-shapes" }
# A datablock's `.glb` / `.gltf` shape file, read as the `.dts` it makes.
torque-import = { path = "../torque-import" }
vehicle = { package = "torque-vehicle", path = "../torque-vehicle" }
images = { package = "torque-images", path = "../torque-images" }
gui = { package = "torque-gui", path = "../torque-gui" }
ts-text = { package = "torque-ts-text", path = "../torque-ts-text" }
ts-vm = { package = "torque-ts-vm", path = "../torque-ts-vm" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The window glue (`platform`): the window's keys and buttons, the cursor's hold.
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

# The window glue's URL opener: Windows' URL handler (ShellExecuteExW, no command line).
[target.'cfg(windows)'.dependencies]
open = { version = "5.4.4", default-features = false, features = ["shellexecute-on-windows"], optional = true }

# A game socket over WebSocket (the `web-socket` feature): natively a plain `ws` connection made with tungstenite...
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, optional = true }
# A data channel beside it (the `webrtc` feature): natively ICE, DTLS and SCTP over a UDP socket made here...
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"], optional = true }

# ... and in a browser the page's own `WebSocket`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["BinaryType", "MessageEvent", "WebSocket"], optional = true }
# ... and in a browser the page's own `RTCPeerConnection`, whose offers and answers are promises.
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { workspace = true }
# The host tests' draw cache (no font files: nothing is drawn as text).
fonts = { package = "torque-fonts", path = "../torque-fonts" }
# The synced pose tests' figure.
torque-shape-builder = { path = "../torque-shape-builder" }

[features]
# The window glue (`platform`): keys, cursor hold, frame cap, URL opener; in a browser the page's focus and pointer lock
# (`platform::web_input`).
window = [
    "dep:winit",
    "dep:open",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/Event",
    "web-sys/EventTarget",
    "web-sys/Window",
]
# The datagrams over WebSocket (`net::web_socket`): the browser's side of a server's web transport.
web-socket = ["torque-server/web", "dep:tungstenite", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
# The datagrams over a WebRTC data channel beside the game socket (`net::web_rtc`): the browser's side of a server's data
# channels.
webrtc = [
    "web-socket",
    "torque-server/webrtc",
    "dep:str0m",
    "dep:wasm-bindgen-futures",
    "web-sys/RtcDataChannel",
    "web-sys/RtcDataChannelInit",
    "web-sys/RtcDataChannelState",
    "web-sys/RtcDataChannelType",
    "web-sys/RtcIceConnectionState",
    "web-sys/RtcPeerConnection",
    "web-sys/RtcSdpType",
    "web-sys/RtcSessionDescription",
    "web-sys/RtcSessionDescriptionInit",
]

[[bench]]
name = "client"
harness = false

[lints]
workspace = true
