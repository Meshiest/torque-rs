[package]
name = "torque-render-scene"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# A frame as plain data for the renderers (the fixed-function draw list, the enhanced renderer's data, the camera, the
# scene's source). No GPU and no wgpu. Everything here is Send + Sync.

[dependencies]
glam = { workspace = true }
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
# The client's world of ghosts a frame draws from (its eye, its ghosts and their records: `source`, `world`).
ghost_world = { package = "torque-ghost-world", path = "../torque-ghost-world" }
# The records and datablock values of TGE's own set (`world`).
ghosts = { package = "torque-ghosts", path = "../torque-ghosts" }
# The texture decoders and mip chains (`textures`).
images = { package = "torque-images", path = "../torque-images" }
# A map's collision (the replicators' ground) and its files' importers (`map`).
collide = { package = "torque-collide", path = "../torque-collide" }
mapcore = { package = "torque-mapcore", path = "../torque-mapcore" }
maps = { package = "torque-maps", path = "../torque-maps" }
rayon = "1.11"
# The shape files the shapes draw (`shapes`).
shapes = { package = "torque-shapes", path = "../torque-shapes" }
# A datablock's `.glb` / `.gltf` shape file, read as the `.dts` it makes.
torque-import = { path = "../torque-import" }
# The day's sun the TimeOfDay ghost runs on the client (`hd::environment`).
torque-scene = { path = "../torque-scene" }

[dev-dependencies]
criterion = { workspace = true }
# The benches' interior (`benches/scene.rs`).
torque-interior-builder = { path = "../torque-interior-builder" }
# The shapes' material tests build their shapes.
torque-shape-builder = { path = "../torque-shape-builder" }

[[bench]]
name = "scene"
harness = false

[lints]
workspace = true
