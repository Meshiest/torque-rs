[package]
name = "torque-mods"
description = "Local mods for torque-rs: folders and zips of scripts and assets, found, ordered and loaded by rules a game can replace, within hard limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "mods", "plugins", "gamedev"]
categories = ["game-development", "filesystem"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

# `ModsPlugin`: mounts the mods a game's folders and zips hold over its files and runs their scripts as TorqueScript packages.
# How a mod is found, named, ordered and enabled is a set of slots (`ModLayout`, `ModOrder`, ...) with `mod.toml` as the default.
# No drawing, GUI, audio or window crates: a dedicated server takes this crate too.

[dependencies]
torque-bytes = { path = "../torque-bytes" }
torque-engine = { path = "../torque-engine" }
# The wire: the required-mods section of the handshake, the bulk channel and the server's hold on a joining client.
torque-net = { path = "../torque-net" }
torque-server = { path = "../torque-server" }
# The blocks content is cut into, and their hashes (shared with client-to-server transfers).
torque-transfer = { path = "../torque-transfer" }
# The hardened zip reader and its path rules.
torque-resource = { path = "../torque-resource" }
torque-ts-vm = { path = "../torque-ts-vm" }
# `mod.toml`, read strictly.
serde = { version = "1.0.219", features = ["derive"] }
# The content hash.
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

# In a browser the cache lives in IndexedDB (`web_cache`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "Window"] }

[dev-dependencies]
# The seeded random source, the byte mutators, the fuzz rounds and the zip builder of the tests.
torque-testkit = { path = "../torque-testkit", features = ["zip"] }
# The script test helpers (`torque_ts_vm::testing`).
torque-ts-vm = { path = "../torque-ts-vm", features = ["testing"] }
# `tests/late_offer.rs` runs a whole server and its clients over the memory transport (the same way the wire goldens do).
torque = { path = "../torque", default-features = false, features = ["app", "mods"] }
torque-example-minimal-engine = { path = "../../examples/minimal-engine" }
# A second layout's manifest format.
serde_json = "1.0.140"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
