[package]
name = "torque-example"
description = "A dedicated server and a client built on the torque umbrella crate, which connect over the loopback address"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "server", "example", "gamedev"]
categories = ["game-development", "network-programming"]

# A dedicated server over TGE's defaults that runs its own small script mission (`game/`), and a client that connects to it
# over the loopback address and keeps the ghosts it is sent in a client world.

[dependencies]
torque = { path = "../torque", default-features = false, features = ["script", "resource", "game", "server", "ghost-world"] }
# The window client (feature `window`): the client host and its window driver, the GUI pass, the window.
torque-render-core = { path = "../torque-render-core", optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[features]
# `example-window`: the example's client in a window (a GPU and a display). The tests stay headless.
window = ["torque/client-window", "torque/fonts", "dep:torque-render-core", "dep:winit"]

[[bin]]
name = "example-window"
required-features = ["window"]

[lints]
workspace = true
