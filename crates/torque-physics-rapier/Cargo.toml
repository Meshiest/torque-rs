[package]
name = "torque-physics-rapier"
description = "A deterministic Rapier world for torque-rs: map pieces as colliders, caps and guards, budget charging, the same steps on native and wasm32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "physics", "rapier", "determinism", "gamedev"]
categories = ["game-development", "simulation"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

[dependencies]
# `enhanced-determinism`: scalar math and `libm`, so native and wasm32 step alike. No `parallel`, no `simd8`, and no `std`: with it
# the glam layer's 3x3 eigen solver (every body's principal inertia, which a hull or a compound has to find) takes the platform's
# `acos` and `cos`, whose last bit differs between a native build and wasm32; without it the solver goes through `libm`.
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "alloc", "enhanced-determinism"] }
# The map pieces (terrain, interiors) and shape hulls as the engine's collision holds them, and the budget it charges.
torque-collide = { path = "../torque-collide" }
torque-mapcore = { path = "../torque-mapcore" }
# The one transcendental this crate takes itself (a kinematic body's turn), the same bits on every target.
libm = "0.2.16"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "step"
harness = false

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
