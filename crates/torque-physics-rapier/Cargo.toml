[package]
name = "torque-physics-rapier"
description = "A deterministic Rapier world for torque-rs: map pieces as colliders, caps and guards, budget charging, the same steps on native and wasm32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "physics", "rapier", "determinism", "gamedev"]
categories = ["game-development", "simulation"]

[dependencies]
# `enhanced-determinism`: scalar math and `libm`, so native and wasm32 step alike. No `parallel`, no `simd8`.
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"] }
# The map pieces (terrain, interiors) and shape hulls as the engine's collision holds them, and the budget it charges.
torque-collide = { path = "../torque-collide" }
torque-mapcore = { path = "../torque-mapcore" }
# The one transcendental this crate takes itself (a kinematic body's turn), the same bits on every target.
libm = "0.2.16"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "step"
harness = false

[lints]
workspace = true
