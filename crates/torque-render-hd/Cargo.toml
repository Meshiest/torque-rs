[package]
name = "torque-render-hd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The enhanced renderer on the GPU: our own WGSL (`shaders/`) composed with a registered extension's chunks, its passes, and
# the helpers they share, over a `torque-render-core` device and `torque-render-scene`'s frame data.

[dependencies]
glam = { workspace = true }
# The clock: `std::time` natively, the browser's clock on the web.
web-time = "1.1"
torque-render-core = { path = "../torque-render-core" }
torque-render-scene = { path = "../torque-render-scene" }
# A block-compressed map is decoded to RGBA8 on a device without BC textures.
images = { package = "torque-images", path = "../torque-images" }
# Waits on an error scope (the arena checks its buffers were made).
pollster = "0.4"
# The shaders' validation (every file and permutation; the same naga wgpu compiles them with).
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }

[features]
# Debug lines drawn over a finished picture ([`gizmos`]); left out of a shipped build.
gizmos = []

[dev-dependencies]
# The lights-sky example: the day's sun and its pictures.
torque-scene = { path = "../torque-scene" }
png = "0.18"
criterion = { workspace = true }
# The physically based materials' tests and gallery: the sidecar and its material.
torque-modelcore = { path = "../torque-modelcore" }
# The gallery reads a library's files without following links.
torque-resource = { path = "../torque-resource" }
# The particles-showcase example: its window, and the GUI pass's draw list for its tabs.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
torque-gui = { path = "../torque-gui" }

[[bench]]
name = "upload"
harness = false

[lints]
workspace = true
