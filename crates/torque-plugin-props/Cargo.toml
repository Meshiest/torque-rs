[package]
name = "torque-plugin-props"
description = "Props for torque-rs: rigid bodies a server simulates in a deterministic Rapier world and sends to every client, drawn as shapes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "physics", "props", "plugin", "gamedev"]
categories = ["game-development", "simulation"]

# Props: the `PropData` datablock class and the `Prop` ghost class, one persistent Rapier world a server steps after each tick's
# objects, the `prop*` console functions (a server API: no client entry point), a collision source on each side (players
# collide with props), and each client's book of the props it was sent, drawn as shapes. Nothing here draws by itself, so the
# crate builds for wasm32 too.

[dependencies]
torque-collide = { path = "../torque-collide" }
# The prediction slot a client's prop prediction is a part of, and the poses it draws props at.
torque-client = { path = "../torque-client" }
torque-engine = { path = "../torque-engine" }
torque-ghost-world = { path = "../torque-ghost-world" }
# Marking a server object's ghost groups dirty, reading players and map pieces.
torque-game = { path = "../torque-game" }
torque-ghosts = { path = "../torque-ghosts" }
# The hub a server sends bulk channels through, and the scope control its ghosting asks.
torque-server = { path = "../torque-server" }
# The tree a prop hung on another is placed from, and the server's view of it.
torque-hierarchy = { path = "../torque-hierarchy" }
torque-plugin-hierarchy = { path = "../torque-plugin-hierarchy" }
torque-net = { path = "../torque-net" }
torque-physics-rapier = { path = "../torque-physics-rapier" }
torque-ts-text = { path = "../torque-ts-text" }
torque-ts-vm = { path = "../torque-ts-vm" }
# The transcendentals of a transform (an axis and an angle), the same bits on every target.
libm = "0.2.16"
# Feature `rope`: a networked rope that follows a joint (`jointRope`), through the rope plugin's drivers.
torque-plugin-rope = { path = "../torque-plugin-rope", optional = true }

[features]
rope = ["dep:torque-plugin-rope"]

[dev-dependencies]
# A `Vm` with the game classes installed (`torque_game::testing::vm`).
torque-game = { path = "../torque-game", features = ["testing"] }
criterion = { workspace = true }
# The tests' server and clients over the memory transport, and a client that speaks only Torque's protocol.
torque-app = { path = "../torque-app", default-features = false, features = ["renderer"] }
torque-app-server = { path = "../torque-app-server" }
# The floor and the figure of the tests' world.
torque-example-assets = { path = "../../examples/assets" }
torque-shapes = { path = "../torque-shapes" }
# The shape files the collision tests write.
torque-shape-builder = { path = "../torque-shape-builder" }
# The pictures of the ropes that follow joints (feature `rope`), drawn as the rope plugin's own pictures are.
torque-render-core = { path = "../torque-render-core" }
torque-render-scene = { path = "../torque-render-scene" }

[[bench]]
name = "step"
harness = false

[[test]]
name = "joint_rope"
required-features = ["rope"]

[[test]]
name = "joint_rope_pictures"
required-features = ["rope"]

[lints]
workspace = true
