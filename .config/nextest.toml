# cargo-nextest: `just test` and `just t <crate>` run the default profile, CI's pushes and pull requests the `ci` profile and
# CI started by hand the default one.

[profile.default]
# A test past this is reported as slow (never stopped).
slow-timeout = { period = "60s" }

# `just test-quick`: everything but the long randomized and golden suites.
[profile.quick]
default-filter = "not test(/fuzz|golden|hostile|sweep/)"

# CI on pushes and pull requests: everything but the suites that cost minutes each on the runner, which run whenever CI is
# started by hand (and locally): the picture suites, which draw through Mesa's software Vulkan there, and the three longest
# randomized suites. The short fuzz suites stay.
[profile.ci]
default-filter = """
not (
    binary(/picture/)
    or (kind(test) and test(/^[a-z_0-9]*picture[a-z_0-9]*::/))
    or (package(torque-render-hd) and kind(test))
    or (binary_id(torque-app::main) and test(/^(drawn_shapes|gizmos_pictures|render_passes|render_ext|view_rebuild)::/))
    or (binary_id(torque-net-quic::main) and test(/^quic_fuzz::/))
    or (binary_id(torque-ts-vm::main) and test(/^fuzz::/))
    or (binary_id(torque-ts-compiler::main) and test(/^robust::/))
)
"""
# A test still running after 5 minutes is stopped, so a hang costs minutes, not the job's whole timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

# The client-script host's shared cases (`tests/cases.rs`, feature `cases`) include the deadline cases: a guest's entry must be
# stopped by the wall clock within twice its 250 ms deadline, which is what those cases are about and cannot be counted as
# work. They hold whenever the realm gets the processor; on a machine shared with the other test binaries they do not. So
# that one binary takes every test thread while it runs, and nothing else runs beside it.
[test-groups]
alone = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(torque-client-script-host::cases)'
test-group = 'alone'
threads-required = 'num-test-threads'
