# The MSRV clippy checks against comes from `rust-version` in the root Cargo.toml.
# `dbg!` is a warning in library code (see `[workspace.lints.clippy]`) but fine while a test is being written.
allow-dbg-in-tests = true
# The resource layer reads zips in memory and never unpacks one to disk: extraction writes entries' paths onto the host's
# file system, which the zip crate's advisories have been about, so it stays out of the code.
disallowed-methods = [
    { path = "zip::read::ZipArchive::extract", reason = "the resource layer reads zips in memory and never extracts to disk" },
    { path = "zip::read::ZipArchive::extract_with_options", reason = "as extract" },
    { path = "zip::read::ZipArchive::extract_unwrapped_root_dir", reason = "as extract" },
    { path = "zip::unstable::stream::ZipStreamReader::extract", reason = "as extract" },
]
