[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "templates/*", "tests/web/*"]
# The examples' pictures (`examples/README.md`'s), not a crate; the native extension sample, the C header's generator and the
# Lua extension, each built on its own (their own workspaces). The Lua extension builds Luau's C++ sources, so it stays out
# of this workspace: `cargo build` here, with any features, needs no C++ compiler.
exclude = [
    "examples/screenshots",
    "examples/native-extension",
    "crates/torque-plugin-abi/header-gen",
    "crates/torque-plugin-lua",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Verified with `cargo +1.99 check --workspace --all-targets --all-features` (the stable release when it was last raised).
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Meshiest/torque-rs"
publish = false

[workspace.dependencies]
# Vector math. The features are pinned: the f32 and f64 types only, no `scalar-math`, no `fast-math` style option. The
# scalar `Vec3` and `DVec3` round as the plain arithmetic they replace; bit-exact TGE math keeps its own order.
glam = { version = "0.34.2", default-features = false, features = ["std", "f64"] }
# The microbenchmarks (`benches/`).
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The benches' counting allocator (allocations a tick), a wrapper of the system allocator with no `unsafe` on our side.
stats_alloc = "0.1.10"
# The hash of the engine's own ids (object and convex ids) in the hot maps of the collision and the process list.
rustc-hash = "2.1.3"

# Lints the whole workspace passes today. Each crate opts in with `[lints] workspace = true`, except torque-render-core, which
# copies them with `unsafe_code` at `deny` for its one `unsafe` block (its test `the_lints_are_the_workspaces` keeps the copy
# in step).
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
explicit_outlives_requirements = "warn"
keyword_idents = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
# Left-over debugging and placeholders.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Idioms.
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
manual_assert = "warn"
manual_is_variant_and = "warn"
manual_ok_or = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
should_panic_without_expect = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
string_lit_chars_any = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnested_or_patterns = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
# Process control belongs to the host, never to a library.
exit = "warn"
mem_forget = "warn"

# The web builds' module (`web/build.mjs`): release, optimized across the crates at the link (thin LTO).
[profile.web]
inherits = "release"
lto = "thin"

# The web builds' module for the edit-and-reload loop (`web/build.mjs --dev`): the dev profile, so the engine's own crates are
# built unoptimized and incrementally with no link-time optimization, and the third-party crates and the assets' crates as the dev
# profile's package settings below have them. No debug info: wasm-bindgen would carry it into the module and the page would fetch it.
[profile.web-dev]
inherits = "dev"
debug = false

# The client-script host's web cases (`client-script-web-check`): optimized, with debug assertions on, the only builds
# in which tiers may be granted before their review (the host refuses to compile `unreviewed-tiers` without them).
[profile.client-script-check]
inherits = "release"
debug-assertions = true

# Debug builds (`cargo run`, `cargo test`) with the crates that make the examples' assets and their GPU state optimized: the
# examples build their forests' interiors, their textures and the renderer's pipelines at every start, which unoptimized took
# 25 s to the vehicle demo's menu. The engine's own crates stay unoptimized for debugging; the third-party ones (wgpu, naga,
# png and the rest) are optimized too.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.torque-example-assets]
opt-level = 2

[profile.dev.package.torque-interior-builder]
opt-level = 2

[profile.dev.package.torque-maps]
opt-level = 2

[profile.dev.package.torque-modelcore]
opt-level = 2

[profile.dev.package.torque-images]
opt-level = 2
