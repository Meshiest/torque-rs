[workspace]
resolver = "3"
members = [
    "crates/torque-audio",
    "crates/torque-collide",
    "crates/torque-fonts",
    "crates/torque-game",
    "crates/torque-ghost-world",
    "crates/torque-ghosts",
    "crates/torque-gui",
    "crates/torque-images",
    "crates/torque-mapcore",
    "crates/torque-maps",
    "crates/torque-net",
    "crates/torque-render-core",
    "crates/torque-render-hd",
    "crates/torque-render-scene",
    "crates/torque-resource",
    "crates/torque-scene",
    "crates/torque-server",
    "crates/torque-shapes",
    "crates/torque-sim",
    "crates/torque-ts-bytecode",
    "crates/torque-ts-compiler",
    "crates/torque-ts-text",
    "crates/torque-ts-vm",
    "crates/torque-vehicle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Verified with `cargo +1.88 check --workspace --all-targets --all-features` (let chains need 1.88); CI checks it.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/TODO/torque-rs"
publish = false

# Lints the whole workspace passes today. Each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
explicit_outlives_requirements = "warn"
keyword_idents = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
# Left-over debugging and placeholders.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Idioms.
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
manual_assert = "warn"
manual_is_variant_and = "warn"
manual_ok_or = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
should_panic_without_expect = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
string_lit_chars_any = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnested_or_patterns = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
# Process control belongs to the host, never to a library.
exit = "warn"
mem_forget = "warn"
