[package]
name = "torque-example-minimal"
description = "A dedicated server and a client built on the torque umbrella crate, which connect over the loopback address"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "server", "example", "gamedev"]
categories = ["game-development", "network-programming"]
# The integration tests are one program, `tests/main.rs`, with a module per file: fewer links.
autotests = false

# A dedicated server over TGE's defaults that runs its own small script mission (`game/`), and a client that connects to it
# over the loopback address and keeps the ghosts it is sent in a client world.

[dependencies]
torque = { path = "../../crates/torque", default-features = false, features = ["script", "resource", "game", "server", "ghost-world"] }
# The window client (feature `window`): the client host and its window driver, the GUI pass, the window.
torque-render-core = { path = "../../crates/torque-render-core", optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }

[features]
# A packaged game (`just bundle examples/minimal`): the game folder is read from beside the executable (`game/`) instead of from
# this crate's folder, so the binaries hold no path of the computer that built them.
bundled = []
# `example-window`: the example's client in a window (a GPU and a display). The tests stay headless.
window = ["torque/client-window", "torque/fonts", "dep:torque-render-core", "dep:winit"]

[[bin]]
name = "example-window"
required-features = ["window"]

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
