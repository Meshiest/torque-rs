[package]
name = "torque-example-vehicle-demo"
description = "A drive for one player or a few on a local network: the box figure walks up to a buggy, clicks to get in and drives it over green checkerboard hills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "gamedev", "vehicle"]
categories = ["game-development"]

# The server (torque-server's main loop and network host over torque-game's classes) and the client (torque-client's
# connection over TGE's records) run in one process and talk through an in-memory datagram link, or over UDP to a hosted
# game; a browser's client over WebSocket and WebRTC (`vehicle-demo-server --transport both --webrtc`, a room's host). The
# game's own scripts are in `game/`, the map in `game/missions/hills.mis`; the terrain, the buggy and the figure are the
# asset kit's.

[dependencies]
torque = { path = "../../crates/torque", default-features = false, features = ["app", "web", "webrtc", "p2p"] }
torque-example-build-features = { path = "../build-features" }
torque-example-assets = { path = "../assets" }
torque-example-common = { path = "../common" }
torque-render-core = { path = "../../crates/torque-render-core" }
torque-render-scene = { path = "../../crates/torque-render-scene" }
# Gamepads (the `gamepad` feature).
torque-plugin-gamepad = { path = "../../crates/torque-plugin-gamepad", optional = true }

[dev-dependencies]
# The scripted pads of the gamepad test (`FakePads`).
torque-plugin-gamepad = { path = "../../crates/torque-plugin-gamepad", features = ["testing"] }
# The ghost-shots example's second renderer (the reference it measures the frames against).
torque-render-hd = { path = "../../crates/torque-render-hd" }

# Built for the web: the functions the page calls (`torque::app::web_exports!`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
# Gamepads: `DemoPlugins` adds the gamepad plugin and the game's script binds the pad's sticks and buttons (pads plugged in play the
# demo; with the feature off, or no pad, the demo is as it was).
gamepad = ["dep:torque-plugin-gamepad"]

[[bin]]
name = "vehicle-demo"
path = "src/main.rs"

[[bin]]
name = "vehicle-demo-server"
path = "src/bin/vehicle-demo-server.rs"

[lints]
workspace = true
