[package]
name = "torque-example-fps"
description = "A small arena shooter for one player or a few on a local network: a main menu, a list of the network's games, the box figure with a pistol in first person, bolts that hurt, rounds and chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "multiplayer", "gamedev"]
categories = ["game-development"]

# The server (torque-server's main loop and network host over torque-game's classes) and each client (torque-client's
# connection over TGE's records) talk over UDP; a host runs its server in the same process and joins it over the loopback
# address. The game's own scripts are in `game/`; the maps are the `.mis` files in `game/missions/`.

[dependencies]
torque = { path = "../../crates/torque", default-features = false, features = ["app", "maps"] }
torque-example-assets = { path = "../assets" }
torque-example-common = { path = "../common" }
torque-render-core = { path = "../../crates/torque-render-core" }
torque-render-scene = { path = "../../crates/torque-render-scene" }

[[bin]]
name = "fps-client"
path = "src/bin/fps-client.rs"

[[bin]]
name = "fps-server"
path = "src/bin/fps-server.rs"

[lints]
workspace = true
