[package]
name = "torque-example-fps"
description = "A small arena shooter for one player or a few on a local network: a main menu, a list of the network's games, the box figure with a pistol in first person, bolts that hurt, rounds and chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "multiplayer", "gamedev"]
categories = ["game-development"]

# The server (torque-server's main loop and network host over torque-game's classes) and each client (torque-client's
# connection over TGE's records) talk over UDP, or a browser's client over WebSocket (`fps-server --transport both`); a host runs its server in the same process and joins it over the loopback
# address. The game's own scripts are in `game/`; the maps are the `.mis` files in `game/missions/`.

[dependencies]
torque = { path = "../../crates/torque", default-features = false, features = ["app", "maps", "web", "webrtc", "p2p"] }
torque-example-build-features = { path = "../build-features" }
torque-example-assets = { path = "../assets" }
torque-example-common = { path = "../common" }
torque-render-core = { path = "../../crates/torque-render-core" }
torque-render-scene = { path = "../../crates/torque-render-scene" }
# The rope plugin, for `--beam-shots` (the `rope` feature): a beam from the pistol's muzzle.
torque-plugin-rope = { path = "../../crates/torque-plugin-rope", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The host key's random bits.
getrandom = "0.3"

[features]
# The rope plugin in the arena: ropes and beams that follow the figures' muzzles as the frame draws them (`--beam-shots`).
rope = ["dep:torque-plugin-rope"]
# Built for the web: the module carries its files (the pack whose path is in `TORQUE_WEB_PACK` when it is built) instead of
# fetching them by the list beside the page (`files.json`).
embed-pack = []

# Built for the web: a panic shown in the page's console, the page's address and root element, and the functions the page
# calls.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "Window"] }

[dev-dependencies]
# The tests' vector math.
glam = { workspace = true }

[[bin]]
name = "fps-client"
path = "src/bin/fps-client.rs"

[[bin]]
name = "fps-server"
path = "src/bin/fps-server.rs"

[lints]
workspace = true
