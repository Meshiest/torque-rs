[package]
name = "torque-example-assets"
description = "The example games' shared asset kit: original shapes and textures made from code, written as .dts and .png"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "assets", "gamedev"]
categories = ["game-development"]

# Every asset is made by this crate's code (boxes, keyframes, pixel patterns): nothing is read from any other file. The examples
# call `write_all` at start-up, or `just examples/assets` writes the set to a folder.

[dependencies]
glam = { workspace = true }
torque-shape-builder = { path = "../../crates/torque-shape-builder" }
torque-shapes = { path = "../../crates/torque-shapes" }
torque-interior-builder = { path = "../../crates/torque-interior-builder" }
# The cube, figure and pistol also as `.glb`, through the model layer.
torque-import = { path = "../../crates/torque-import" }
png = "0.18"

[dev-dependencies]
# torque-images decodes the textures back in the tests.
torque-images = { path = "../../crates/torque-images" }
# The arena interior checked by brute force.
torque-interior-builder = { path = "../../crates/torque-interior-builder", features = ["verify"] }

[[bin]]
name = "make-example-assets"

[lints]
workspace = true
