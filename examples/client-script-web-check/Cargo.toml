[package]
name = "torque-example-client-script-web-check"
description = "The client-script host's cases in a browser build: the realm's guest in Workers, run by web/client-script-check.mjs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "lua", "sandbox", "wasm", "test"]
categories = ["game-development", "wasm"]

# A module for wasm32-unknown-unknown (the justfile's `client-script-web-check`); natively the crate is empty.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
torque-client-script-host = { path = "../../crates/torque-client-script-host", features = ["web", "cases"] }
wasm-bindgen = "0.2"
wat = "1"

[lints]
workspace = true
