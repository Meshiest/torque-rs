[package]
name = "torque-example-mods-demo"
description = "A game mode written in Lua and shipped as a server-required mod: a small soccer match whose clients download its content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "mods", "lua", "example", "gamedev"]
categories = ["game-development"]

# A server whose game mode is a mod (`game/mods/soccer`: TorqueScript for the datablocks, Lua for the rules) and two clients that
# download the mod's content when they join and play the match. The Lua extension is built apart (`just lua`) and loaded from a
# `plugins/` folder, as a game loads it; this crate never links it. Run it with `just examples mods-demo run`.

[dependencies]
# `web` and `webrtc`: the server's web transport and data channels natively, the client's game socket over WebSocket with a
# data channel beside it in a browser; `p2p`: a server hosted through a room service, and a page that joins it by its code.
torque = { path = "../../crates/torque", default-features = false, features = ["app-core", "renderer", "mods", "web", "webrtc", "p2p"] }
torque-example-build-features = { path = "../build-features" }
torque-example-assets = { path = "../assets" }
# The ball: a prop the players' boxes push.
torque-plugin-props = { path = "../../crates/torque-plugin-props" }
torque-render-core = { path = "../../crates/torque-render-core" }
torque-render-scene = { path = "../../crates/torque-render-scene" }

# Natively: the Lua extension the server's game mode runs on, loaded from `plugins/`, and the sound card the window plays
# the kick through.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
torque = { path = "../../crates/torque", default-features = false, features = ["native-extensions", "audio-device"] }

# Built for the web: the functions the page calls (`torque::app::web_exports!`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `prepare`, the page's await before the game starts (opening the browser's storage).
wasm-bindgen-futures = "0.4"

[features]
default = ["gizmos"]
# The debug gizmos (`torque.gizmos`): on for development, off in a packaged game unless its game.toml enables the plugin.
gizmos = ["torque/gizmos"]
# A packaged game (`just bundle examples/mods-demo`): the game folder and the Lua extension are read from beside the
# executable (`game/`, `plugins/`) instead of from this crate's folder and the build folder.
bundled = []

[lints]
workspace = true
