# How the engine runs this game; every key is optional. See the book's Plugins chapter.

[game]
name = "Mods demo"
server = "server.cs"
client = "client.cs"

[plugins]
# Plugins of DefaultPlugins this game never uses: no water, no terrain. The game-list queries stay on (the join screen lists
# the network's games, and a server answers them), and so does sound: the kick plays through the engine's mixer (silent in
# the headless demo).
disable = ["torque.water", "torque.terrain"]
