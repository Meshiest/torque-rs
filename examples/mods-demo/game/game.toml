# How the engine runs this game; every key is optional. See the book's Plugins chapter.

[game]
name = "Mods demo"
server = "server.cs"
client = "client.cs"

[plugins]
# Plugins of DefaultPlugins this game never uses: no water, no terrain, no game-list queries. Sound stays on: the kick plays
# through the engine's mixer (silent in the headless demo).
disable = ["torque.water", "torque.terrain", "torque.server-query"]
