id = "golden-orbs"
version = "1.0.0"
name = "Golden Orbs"
description = "Every third orb is gold: worth three points, with a gold rope."
author = "torque-rs"
# Needs the orbs mod and loads after it, though "golden-orbs" sorts before "orbs": a requirement beats the order of the names.
requires = ["orbs >= 1.0"]
requires_plugins = ["torque.lua"]
# The rules are the server's own: players need nothing from this mod, so a client is never asked for it.
share = "none"
