[package]
name = "torque-example-level-demo"
description = "A singleplayer world in a window: a menu of cube maps, the box figure walking and jumping on them, a server and a client joined in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "gamedev"]
categories = ["game-development"]

# The server (torque-server's main loop and network host over torque-game's classes) and the client (torque-client's
# connection over TGE's records) run in one process and talk through an in-memory datagram link. The game's own scripts are
# in `game/`; the maps are the `.mis` files in `game/missions/`, read when the example starts.

[dependencies]
torque = { path = "../../crates/torque", default-features = false, features = ["app", "maps"] }
torque-example-assets = { path = "../assets" }
torque-example-common = { path = "../common" }
torque-import = { path = "../../crates/torque-import" }
torque-interior-builder = { path = "../../crates/torque-interior-builder" }
torque-render-core = { path = "../../crates/torque-render-core" }
torque-render-scene = { path = "../../crates/torque-render-scene" }
# A rope across the plaza (the `rope` feature).
torque-plugin-rope = { path = "../../crates/torque-plugin-rope", optional = true }
# The smoothed predictor beside TGE's (the `smooth-prediction` feature).
torque-plugin-smooth-prediction = { path = "../../crates/torque-plugin-smooth-prediction", optional = true }

[features]
# A rope the plaza has hung between its front pillars, simulated and drawn by `torque-plugin-rope` (`--rope-shots` draws it; with the
# feature off, or on a map other than the plaza, the demo is as it was).
rope = ["dep:torque-plugin-rope"]
# The smoothed predictor registered beside TGE's (`setPredictor("smooth")` swaps to it; the demo starts with TGE's), and
# `--correction-shots`, which draws a forced correction with each.
smooth-prediction = ["dep:torque-plugin-smooth-prediction"]
# Built for the web: the module carries its files (the pack whose path is in `TORQUE_WEB_PACK` when it is built) instead of
# fetching them by the list beside the page (`files.json`).
embed-pack = []

# Built for the web: the functions the page calls (`torque::app::web_exports!`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
torque-maps = { path = "../../crates/torque-maps" }
torque-interior-builder = { path = "../../crates/torque-interior-builder", features = ["verify"] }

[[bin]]
name = "example-level-demo"
path = "src/main.rs"

[lints]
workspace = true
