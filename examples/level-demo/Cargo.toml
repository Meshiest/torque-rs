[package]
name = "torque-example-level-demo"
description = "A world in a window: a menu of maps, the box figure walking and jumping on them, and the office played with others"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "gamedev"]
categories = ["game-development"]

# The server (torque-server's main loop and network host over torque-game's classes) and the client (torque-client's
# connection over TGE's records) run in one process and talk through an in-memory datagram link. The game's own scripts are
# in `game/`; the maps are the `.mis` files in `game/missions/`, read when the example starts.

[dependencies]
# `mods`: the office's server requires the catalog mod of its clients; `web`, `webrtc` and `p2p`: the office server's web
# transport, data channels and rooms natively, and in a browser the game socket a page joins it on.
torque = { path = "../../crates/torque", default-features = false, features = ["app", "maps", "mods", "web", "webrtc", "p2p", "quic"] }
torque-example-build-features = { path = "../build-features" }
torque-example-assets = { path = "../assets" }
torque-example-common = { path = "../common" }
torque-import = { path = "../../crates/torque-import" }
torque-interior-builder = { path = "../../crates/torque-interior-builder" }
torque-render-core = { path = "../../crates/torque-render-core" }
torque-render-scene = { path = "../../crates/torque-render-scene" }
# The levels' furniture and desk items as props a figure pushes, the client predicting the ones it pushes.
torque-plugin-props = { path = "../../crates/torque-plugin-props" }
# A rope across the plaza (the `rope` feature).
torque-plugin-rope = { path = "../../crates/torque-plugin-rope", optional = true }
# The smoothed predictor beside TGE's (the `smooth-prediction` feature).
torque-plugin-smooth-prediction = { path = "../../crates/torque-plugin-smooth-prediction", optional = true }
# The prop catalog (`catalog`): a server-offered mod whose menu runs in the realm of each client, and lays its containers out.
torque-client-script-format = { path = "../../crates/torque-client-script-format" }
torque-plugin-client-script = { path = "../../crates/torque-plugin-client-script" }
torque-plugin-gui-layout = { path = "../../crates/torque-plugin-gui-layout" }

[features]
# A rope the plaza has hung between its front pillars, simulated and drawn by `torque-plugin-rope` (`--rope-shots` draws it; with the
# feature off, or on a map other than the plaza, the demo is as it was). It also turns on the props' `jointRope`.
rope = ["dep:torque-plugin-rope", "torque-plugin-props/rope"]
# The smoothed predictor registered beside TGE's (`setPredictor("smooth")` swaps to it; the demo starts with TGE's), and
# `--correction-shots`, which draws a forced correction with each.
smooth-prediction = ["dep:torque-plugin-smooth-prediction"]
# Built for the web: the module carries its files (the pack whose path is in `TORQUE_WEB_PACK` when it is built) instead of
# fetching them by the list beside the page (`files.json`).
embed-pack = []

# Natively the catalog's realm runs its guest under Wasmtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
torque-client-script-host = { path = "../../crates/torque-client-script-host", features = ["wasmtime"] }

# Built for the web: the functions the page calls (`torque::app::web_exports!`), and the catalog's realm in the page's Worker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
torque-client-script-host = { path = "../../crates/torque-client-script-host", features = ["web"] }

[dev-dependencies]
# The level-profile example's pass times.
torque-render-hd = { path = "../../crates/torque-render-hd" }
torque-maps = { path = "../../crates/torque-maps" }
torque-interior-builder = { path = "../../crates/torque-interior-builder", features = ["verify"] }

[[bin]]
name = "example-level-demo"
path = "src/main.rs"

# The office server people join (console only): the office with its props, the catalog mod required of its players.
[[bin]]
name = "office-server"
path = "src/bin/office-server.rs"

[lints]
workspace = true
