# How the engine runs this game; every key is optional. See the book's Plugins chapter.

[game]
name = "Minimal, on the engine"
# The scripts a server and a client run first (their defaults are server.cs and main.cs).
server = "server.cs"
client = "client.cs"

[plugins]
# Plugins of DefaultPlugins this game never uses: no sound, no water, no terrain, no game-list queries.
disable = ["torque.audio", "torque.water", "torque.terrain", "torque.server-query"]
