[package]
name = "torque-example-common"
description = "What the example games share beyond torque::app: the asset kit as a resource reader, the shared scripts and the game folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["torque", "example", "rendering", "gamedev"]
categories = ["game-development", "rendering"]

[dependencies]
glam = { workspace = true }
torque = { path = "../../crates/torque", default-features = false, features = ["app"] }
torque-example-assets = { path = "../assets" }
torque-render-scene = { path = "../../crates/torque-render-scene" }

[dev-dependencies]
# The kit's pictures (`examples/kit-shots.rs`) read the frames back.
torque-render-core = { path = "../../crates/torque-render-core" }

[lints]
workspace = true
