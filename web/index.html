<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torque-rs</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #12141a; color: #dde2ec; font: 16px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game's canvas fills the window (over the size the window driver writes on it) and follows it; the game draws at its
     device pixels under the render scale, and the browser stretches that over it. The page's own panels sit above it. */
  body > canvas { display: block; outline: none; position: fixed; inset: 0; z-index: 0;
    width: 100% !important; height: 100% !important; min-width: 0 !important; max-width: none !important;
    min-height: 0 !important; max-height: none !important; }
  #loading, #fps, #gear, #gallery, #settings, #leave, #invites { z-index: 1; }
  /* Behind an open invite panel: takes the clicks beside it, so none reaches the game (invites.js `panelUp`). */
  #invites-backdrop { position: fixed; inset: 0; z-index: 1; }
  #loading { position: fixed; inset: auto 1rem 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  #status { margin: 0; text-align: center; max-width: 48rem; overflow-wrap: anywhere; }
  /* The loading bar (loading.js `showBar`): a download's share fills it; a stage of unknown length slides a piece of it across.
     Both are drawn by a transform alone, which the browser animates on its compositor: the bar keeps moving while the game's
     work holds the page's thread. With reduced motion the piece stays still and the whole bar pulses (opacity, also the
     compositor's). */
  #progress { position: relative; width: min(24rem, 100%); height: 0.5rem; overflow: hidden; border-radius: 0.25rem;
    background: #2a3040; }
  #progress[hidden] { display: none; }
  #progress > span { position: absolute; inset: 0; border-radius: inherit; background: #7aa2f7; transform-origin: left center;
    transform: scaleX(0); }
  #progress.busy > span { right: auto; width: 40%; transform: translateX(-100%); will-change: transform;
    animation: progress-slide 1.4s ease-in-out infinite; }
  @keyframes progress-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) {
    #progress.busy > span { width: 100%; transform: none; will-change: opacity;
      animation: progress-pulse 1.6s ease-in-out infinite alternate; }
  }
  @keyframes progress-pulse { from { opacity: 0.35; } to { opacity: 0.9; } }
  #fps { position: fixed; top: 0.5rem; left: 0.5rem; padding: 0.2rem 0.5rem; background: #000a; color: #e8ecf4;
    font: 13px ui-monospace, monospace; border-radius: 4px; pointer-events: none; }
  /* The gear and the gallery button sit under the game's frame-rate line at the top right (`--gear-top`, set by the script
     from the size the game draws at), and the settings panel opens under them. */
  #gear, #gallery { position: fixed; top: var(--gear-top, 3rem); right: 0.5rem; box-sizing: border-box; width: 2.25rem;
    height: 2.25rem; padding: 0; border: 1px solid #3a4152; border-radius: 6px; background: #1c2029e6; color: #dde2ec;
    font-size: 1.25rem; line-height: 1; cursor: pointer; }
  #gallery { right: 3.15rem; display: flex; align-items: center; justify-content: center; }
  #gallery[hidden] { display: none; }
  #gallery svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
  #gear:hover, #gallery:hover { background: #262c38; }
  #gear:focus-visible, #gallery:focus-visible, #settings select:focus-visible, #settings input:focus-visible,
  #settings button:focus-visible { outline: 2px solid #7aa2f7; outline-offset: 2px; }
  #settings { position: fixed; top: calc(var(--gear-top, 3rem) + 2.75rem); right: 0.5rem; width: 15rem; padding: 0.75rem 0.9rem;
    border: 1px solid #3a4152; border-radius: 8px; background: #1c2029f2; box-shadow: 0 6px 20px #0008; }
  #settings h2 { margin: 0 0 0.6rem; font-size: 0.95rem; font-weight: 600; }
  #settings .row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin: 0.45rem 0; font-size: 0.9rem; }
  #settings select { font: inherit; padding: 0.15rem 0.3rem; background: #12141a; color: #dde2ec; border: 1px solid #3a4152; border-radius: 4px; }
  #settings input[type=checkbox] { accent-color: #7aa2f7; width: 1rem; height: 1rem; }
  #settings .note { margin: 0.5rem 0 0; font-size: 0.8rem; color: #9aa3b5; }
  #settings .close { margin-top: 0.6rem; font: inherit; font-size: 0.85rem; padding: 0.2rem 0.7rem; background: #262c38;
    color: #dde2ec; border: 1px solid #3a4152; border-radius: 4px; cursor: pointer; }
  /* Asked before the gallery button leaves the game. */
  #leave { position: fixed; top: calc(var(--gear-top, 3rem) + 2.75rem); right: 0.5rem; width: 15rem; padding: 0.75rem 0.9rem;
    border: 1px solid #3a4152; border-radius: 8px; background: #1c2029f2; box-shadow: 0 6px 20px #0008; font-size: 0.9rem; }
  #leave p { margin: 0 0 0.7rem; }
  #leave .row { display: flex; gap: 0.5rem; }
  #leave a, #leave button { font: inherit; font-size: 0.85rem; padding: 0.2rem 0.7rem; background: #262c38; color: #dde2ec;
    border: 1px solid #3a4152; border-radius: 4px; cursor: pointer; text-decoration: none; }
  #leave a { background: #2f4a80; border-color: #7aa2f7; }
  #leave a:focus-visible, #leave button:focus-visible { outline: 2px solid #7aa2f7; outline-offset: 2px; }
  #invites { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(34rem, calc(100% - 2rem));
    max-height: calc(100% - 2rem); overflow-y: auto; box-sizing: border-box; padding: 1rem 1.2rem; border: 1px solid #3a4152;
    border-radius: 8px; background: #1c2029f7; box-shadow: 0 6px 20px #0008, 0 0 0 100vmax #000a; font-size: 0.92rem;
    line-height: 1.4; }
  /* The panel's second shadow dims the page around it (a shadow takes no clicks): the game's own menu and status line
     stay visible under it but do not compete with the panel, which says how its connection goes itself. */
  #invites h2 { margin: 0 0 0.6rem; font-size: 1.1rem; }
  #invites h3 { margin: 1rem 0 0.3rem; font-size: 0.95rem; }
  #invites p { margin: 0.45rem 0; }
  #invites fieldset { margin: 0.6rem 0; padding: 0.4rem 0.7rem; border: 1px solid #3a4152; border-radius: 6px; }
  #invites .choice { display: flex; align-items: center; gap: 0.45rem; margin: 0.2rem 0; }
  #invites .privacy { color: #c3cad8; }
  #invites .warn { color: #f0c674; font-size: 0.85rem; }
  #invites .said { color: #9aa3b5; min-height: 1.2em; }
  #invites .status { color: #dde2ec; font-weight: 600; }
  #invites .status:empty { display: none; }
  #invites .count { color: #c3cad8; }
  #invites a { color: #7aa2f7; }
  #invites .row { display: flex; gap: 0.5rem; }
  #invites input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 0.3rem 0.4rem; background: #12141a; color: #dde2ec;
    border: 1px solid #3a4152; border-radius: 4px; }
  #invites button { font: inherit; padding: 0.3rem 0.8rem; background: #262c38; color: #dde2ec; border: 1px solid #3a4152;
    border-radius: 4px; cursor: pointer; }
  #invites button.primary { background: #2f4a80; border-color: #7aa2f7; }
  #invites button.close { margin-top: 0.8rem; }
  #invites button + button { margin-left: 0.5rem; }
  #invites .row > button + button { margin-left: 0; }
  #invites button:focus-visible, #invites input:focus-visible, #invites a:focus-visible { outline: 2px solid #7aa2f7; outline-offset: 2px; }
  #invites ol { margin: 0.6rem 0; padding-left: 0; list-style: none; }
  #invites li { margin: 0.5rem 0; padding: 0.4rem 0.6rem; border: 1px solid #2c3240; border-radius: 6px; }
  #invites .details p { margin: 0.3rem 0; color: #9aa3b5; font-size: 0.85rem; }
</style>
</head>
<body>
<div id="loading">
  <p id="status">Loading...</p>
  <div id="progress" class="busy" role="progressbar" aria-labelledby="status" aria-valuemin="0" aria-valuemax="100"><span></span></div>
</div>
<div id="fps" hidden></div>
<a id="gallery" href="../" aria-label="Back to the gallery" title="Back to the gallery" hidden>
  <svg viewBox="0 0 16 16" aria-hidden="true">
    <rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/>
    <rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>
  </svg>
</a>
<div id="leave" role="alertdialog" aria-labelledby="leave-text" hidden>
  <p id="leave-text">Leave the game and go back to the gallery?</p>
  <div class="row"><a href="../">Leave</a><button type="button">Stay</button></div>
</div>
<button id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings" title="Settings">&#9881;</button>
<div id="settings" role="dialog" aria-labelledby="settings-title" hidden>
  <h2 id="settings-title">Settings</h2>
  <div class="row">
    <label for="quality">Graphics quality</label>
    <select id="quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="ultra">Ultra</option>
    </select>
  </div>
  <div class="row">
    <label for="scale">Render scale</label>
    <select id="scale">
      <option value="auto">Auto</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
    </select>
  </div>
  <div class="row">
    <label for="show-fps">Show frame rate (F8)</label>
    <input id="show-fps" type="checkbox">
  </div>
  <p class="note" id="settings-note" hidden></p>
  <button class="close" type="button">Close</button>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module">
  // The module either carries its files or fetches them by `files.json` (files.js). The loading display shows each stage
  // (loading.js): the page's (the module's download and compile, the files, the start) and then the game's, which it writes
  // on the root element's `data-torque-stage`. A refused file or list is shown here, and its message is on the root element's
  // `data-torque-refused` for a test.
  //
  // The gallery button, beside the gear: shown on a page that is part of the website (`site.mjs` marks it with the root
  // element's `data-torque-gallery="1"`), whose gallery is the folder above it.
  //
  // The settings (the gear, top right, under the game's frame-rate line; settings.js): the renderer's quality, through the
  // scripts' `setRenderQuality` and applied at the game's next frame; the render scale, the root element's
  // `data-torque-render-scale`, which the game reads each frame (`auto`: every device pixel of the full-window canvas up to
  // a 1920x1080 screen's worth); and the frame-rate display (also F8), from the game's `data-torque-fps` and
  // `data-torque-frame-ms`. All are kept in the browser's storage.
  //
  // `torque` (bridge.js, also `window.torque`): the page calls the game's scripts (`torque.call`, `eval`, `getVar`,
  // `setVar`) and registers handlers the scripts call (`torque.on`, `callPage` in script).
  //
  // `?host=1` (host.js): the page hosts a game others join by its room code, its server in a Web Worker.
  //
  // `data-torque-solo="1"` on the root element (`build.mjs --solo`, a site with no game server): the game is played alone. A
  // game whose module has `startSoloClient` (the arena) plays on its own server in a Web Worker (host.js, with no room), and
  // its menus offer neither hosting nor joining through a room service; `?host=1` is then ignored. Its menu's Host with a link
  // and Join with Link trade connection codes by hand instead (invites.js `soloPage`), and the page never loads again: an
  // invite link (`#join=<code>`, or one pasted into Join with Link) starts the game as played alone with the join's panel
  // over its menu, and switches it to the host's game once the channel opens (the game's `switchTo`); Back to the menu,
  // and leaving that game, switch it back. A reply link (`#reply=<code>`) hands its reply to this browser's game tab and
  // starts no game unless its Back to the menu is pressed. A game played alone in the page itself (the vehicle demo) hosts
  // with a link by starting its server in the worker then (as `?host=1` with no room) and switching its game to it.
  //
  // Esc: a browser keeps it for itself while the pointer is locked (it ends the lock) and in full screen (it leaves it). The
  // game takes a lost lock as its Esc. In full screen, Chromium's keyboard lock passes Esc on to the game (held, it still
  // leaves full screen).
  import { fetchFiles, Refused } from './files.js';
  import { fpsText, later, readStreamed, showBar, stageText } from './loading.js';
  import * as settings from './settings.js';
  import { createTorque } from './bridge.js';
  import { replyTab, soloPage, takeFragment } from './invites.js';

  // `?nolock` (the browser checks load every page with it): the page never takes the pointer lock. In headless Chrome on Windows
  // a lock confines the real cursor to the invisible window.
  if (new URLSearchParams(location.search).has('nolock')) {
    Object.defineProperty(Element.prototype, 'requestPointerLock', {
      value() {
        return Promise.resolve();
      },
      writable: false,
      configurable: false,
    });
  }

  const root = document.documentElement;
  const alone = root.dataset.torqueSolo === '1';
  // An invite or reply link: read, and cleared from the address bar, before anything else (a page played alone only).
  const invite = alone ? takeFragment() : null;
  // A page played alone: its invite panels and its game's switches in place; an invite link's panel shows at once.
  let page = null;
  const pageOf = () => (page ??= soloPage());
  if (invite?.kind === 'join') pageOf().join(invite.code);
  const status = document.getElementById('status');
  const bar = document.getElementById('progress');
  let stage = null;
  const torque = createTorque();
  globalThis.torque = torque;

  // Shows `next`, with a download's bytes; a stage without bytes shows a moving bar.
  function show(next, done = null, total = null) {
    stage = next;
    status.textContent = stageText(next, done, total);
    showBar(bar, done, total);
  }

  // The game's own stages, as it writes them; the display goes once it is ready.
  new MutationObserver(() => {
    const next = root.dataset.torqueStage;
    if (!next || !later(stage, next)) return;
    if (next === 'ready') {
      stage = next;
      document.getElementById('loading')?.remove();
    } else {
      show(next);
    }
  }).observe(root, { attributes: true, attributeFilter: ['data-torque-stage'] });

  // The settings, kept in the browser's storage (none where it is blocked: they last until the page closes).
  let storage = null;
  try {
    storage = globalThis.localStorage ?? null;
  } catch {}
  const chosen = settings.load(storage, navigator.userAgent);
  const gear = document.getElementById('gear');
  const panel = document.getElementById('settings');
  const quality = document.getElementById('quality');
  const scale = document.getElementById('scale');
  const showFps = document.getElementById('show-fps');
  const note = document.getElementById('settings-note');
  const fps = document.getElementById('fps');
  document.getElementById('gallery').hidden = root.dataset.torqueGallery !== '1';
  quality.value = chosen.quality;
  scale.value = chosen.scale;
  root.dataset.torqueRenderScale = chosen.scale;
  showFps.checked = chosen.fps;
  fps.hidden = !chosen.fps;

  // The quality to the game's scripts (a request made before the game runs waits for it; the game applies it at its next
  // frame).
  function applyQuality() {
    torque.call('setRenderQuality', chosen.quality).then(
      () => {
        note.hidden = true;
      },
      (e) => {
        // a game whose page has no bridge to its scripts offers no quality
        if (e.kind === 'no-bridge') quality.disabled = true;
        else {
          note.textContent = `The quality was not changed: ${e.message}`;
          note.hidden = false;
        }
      },
    );
  }
  function keep() {
    if (!settings.save(storage, chosen)) {
      note.textContent = 'The browser keeps no settings for this page: they last until it is closed.';
      note.hidden = false;
    }
  }
  quality.addEventListener('change', () => {
    chosen.quality = quality.value;
    chosen.picked = true;
    applyQuality();
    keep();
  });
  scale.addEventListener('change', () => {
    chosen.scale = scale.value;
    root.dataset.torqueRenderScale = chosen.scale;
    keep();
  });
  function setFps(on) {
    chosen.fps = on;
    showFps.checked = on;
    fps.hidden = !on;
    keep();
  }
  showFps.addEventListener('change', () => setFps(showFps.checked));
  addEventListener('keydown', (e) => {
    if (e.code === 'F8' && !e.repeat) setFps(fps.hidden);
  }, { capture: true });
  // The gear (and the gallery button) under the game's frame-rate line, at the size the game draws at.
  let gearAt = null;
  function placeGear() {
    const top = settings.gearTop(innerHeight, root.dataset.torqueSize);
    if (top === null || top === gearAt) return;
    gearAt = top;
    root.style.setProperty('--gear-top', `${top}px`);
  }
  addEventListener('resize', placeGear);
  setInterval(() => {
    if (!fps.hidden) fps.textContent = fpsText(root.dataset.torqueFps, root.dataset.torqueFrameMs);
    placeGear();
  }, 250);

  function openPanel(open) {
    panel.hidden = !open;
    gear.setAttribute('aria-expanded', String(open));
    if (open) quality.focus();
    else gear.focus();
  }
  gear.addEventListener('click', () => {
    leave.hidden = true;
    openPanel(panel.hidden);
  });

  // The gallery button asks first (a plain click; a middle click or a new tab still just opens the gallery).
  const galleryButton = document.getElementById('gallery');
  const leave = document.getElementById('leave');
  function askLeave(open) {
    leave.hidden = !open;
    if (open) {
      openPanel(false);
      leave.querySelector('a').focus();
    } else {
      galleryButton.focus();
    }
  }
  galleryButton.addEventListener('click', (e) => {
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    askLeave(leave.hidden);
  });
  leave.querySelector('button').addEventListener('click', () => askLeave(false));
  leave.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.stopPropagation();
      askLeave(false);
    }
  });
  panel.querySelector('.close').addEventListener('click', () => openPanel(false));
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.stopPropagation();
      openPanel(false);
    }
  });

  // Chromium: in full screen Esc goes to the game (the keyboard lock); out of it the lock is let go.
  document.addEventListener('fullscreenchange', () => {
    const keyboard = navigator.keyboard;
    if (!keyboard?.lock) return;
    if (document.fullscreenElement) {
      keyboard.lock(['Escape']).catch((e) => console.warn(`the keyboard lock: ${e?.message ?? e}`));
    } else {
      keyboard.unlock();
    }
  });

  async function start() {
    if (!navigator.gpu) {
      status.textContent = 'This game needs a browser with WebGPU (a recent Chrome, Edge or Safari, or Firefox 141 and later).';
      bar.hidden = true;
      return;
    }
    show('module');
    const module = await import('./game.js');
    const wasm = await readStreamed(await fetch(new URL('game_bg.wasm', document.baseURI)), (done, total) =>
      show('module', done, total));
    show('compile');
    await new Promise(requestAnimationFrame);
    const compiled = await WebAssembly.compile(wasm);
    await module.default({ module_or_path: compiled });
    const game = module;
    // `?host=1`: this page hosts a game for others to join by its room code (host.js), its server in a worker. A page
    // played alone runs a game that has its own server the same way, with no room.
    const solo = alone && typeof game.startSoloClient === 'function';
    const hosting = solo || (!alone && new URLSearchParams(location.search).has('host'));
    if (hosting && game.embedded()) throw new Error('a build that carries its files cannot host: its worker fetches them');
    if (alone && typeof game.switchTo === 'function') {
      // A game played alone in the page itself hosts with a link by starting its server in the worker then.
      const startHost =
        !solo && !game.embedded()
          ? async (onHost) => {
              const { hostGame } = await import('./host.js');
              return hostGame(game, () => {}, { solo: true, client: null, onHost, wasm: compiled });
            }
          : null;
      pageOf().attach(game, { startHost });
    } else if (page) {
      throw new Error('this game cannot be joined by an invite link');
    }
    torque.attach(game);
    // The game's first frame is drawn at the quality chosen.
    applyQuality();
    if (!game.embedded()) {
      await fetchFiles(game, (done, total) => show('files', done, total));
    }
    show('start');
    // The start is one call that runs until the game's first frame is asked for: the line is drawn before it.
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);
    if (game.embedded()) {
      game.startEmbedded();
    } else if (hosting) {
      const { hostGame } = await import('./host.js');
      const handle = await hostGame(game, (text) => (status.textContent = text), {
        solo,
        client: solo ? 'solo' : 'host',
        onHost: solo ? pageOf().onHost : null,
        wasm: compiled,
      });
      if (solo) pageOf().hosted(handle);
    } else {
      game.startFetched();
    }
  }

  function failed(e) {
    const message = String(e?.message ?? e);
    bar.hidden = true;
    if (e instanceof Refused) {
      status.textContent = `The game's files were refused: ${message}`;
      root.dataset.torqueRefused = message;
      console.warn(status.textContent);
    } else {
      status.textContent = `The game did not start: ${message}`;
      console.error(status.textContent);
    }
  }

  // A reply link's tab starts the game only when its Back to the menu is pressed.
  (invite?.kind === 'reply' ? replyTab(invite.code, { back: () => start().catch(failed) }) : start()).catch(failed);
</script>
</body>
</html>
