<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torque-rs</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #12141a; color: #dde2ec; font: 16px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #loading { position: fixed; inset: auto 1rem 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  #status { margin: 0; text-align: center; max-width: 48rem; overflow-wrap: anywhere; }
  #progress { width: min(24rem, 100%); accent-color: #7aa2f7; }
</style>
</head>
<body>
<div id="loading">
  <p id="status">Loading...</p>
  <progress id="progress" hidden></progress>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module">
  // The module either carries its files or fetches them by `files.json` (files.js). A refused file or list is shown here, and
  // its message is on the root element's `data-torque-refused` for a test.
  import { fetchFiles, Refused } from './files.js';

  // `?nolock` (the browser checks load every page with it): the page never takes the pointer lock. In headless Chrome on Windows
  // a lock confines the real cursor to the invisible window.
  if (new URLSearchParams(location.search).has('nolock')) {
    Object.defineProperty(Element.prototype, 'requestPointerLock', {
      value() {
        return Promise.resolve();
      },
      writable: false,
      configurable: false,
    });
  }

  const status = document.getElementById('status');
  const bar = document.getElementById('progress');
  const mib = (n) => (n / 1048576).toFixed(1);

  async function start() {
    if (!navigator.gpu) {
      status.textContent = 'This game needs a browser with WebGPU (a recent Chrome, Edge or Safari, or Firefox 141 and later).';
      return;
    }
    const game = await import('./game.js');
    await game.default();
    if (game.embedded()) {
      game.startEmbedded();
    } else {
      bar.hidden = false;
      await fetchFiles(game, (done, total) => {
        bar.max = total;
        bar.value = done;
        status.textContent = `Loading the game's files: ${mib(done)} of ${mib(total)} MiB`;
      });
      status.textContent = 'Starting...';
      bar.hidden = true;
      await new Promise(requestAnimationFrame);
      game.startFetched();
    }
    document.getElementById('loading').remove();
  }

  start().catch((e) => {
    const message = String(e?.message ?? e);
    bar.hidden = true;
    if (e instanceof Refused) {
      status.textContent = `The game's files were refused: ${message}`;
      document.documentElement.dataset.torqueRefused = message;
      console.warn(status.textContent);
    } else {
      status.textContent = `The game did not start: ${message}`;
      console.error(status.textContent);
    }
  });
</script>
</body>
</html>
