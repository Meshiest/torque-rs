# Continuous integration: formatting, lints, tests, examples, API docs, the guide, the MSRV and the dependency policy.
#
# Every third-party action is pinned to a full commit SHA (the tag it was taken from is in the comment); update them
# together.
#
# Off for now (owner, 2026-11-06): the clippy and MSRV jobs (`if: false`) and the Windows tests (the test matrix).
#
# Platforms: lints run on Linux and Windows, everything else on Linux only, except the tests: Linux runs the whole
# workspace (and its doc tests), Windows only the crates whose behavior depends on the platform (sockets, the window and
# input, files, the GPU through WARP, audio, the room service, the script VM's file rules). The other crates are pure
# logic the Linux run already covers, and the example games' long headless runs stay on Linux. Tests run under
# cargo-nextest, which runs the test binaries in parallel.
#
# GPU crates: crates that draw through wgpu build and lint on both runners (wgpu compiles without a GPU). Their tests
# that need an adapter get Mesa's software Vulkan driver (lavapipe, `mesa-vulkan-drivers`) on Linux and WARP on Windows;
# a test that finds no adapter returns early instead of failing, so neither the crates nor the workflow need an
# `--exclude` or a feature switch for a headless runner.
#
# The browser check guard (web/guard.mjs) is scanned and tested on Linux, where the runner has Chrome.
#
# Linux also needs the ALSA headers for the `torque-audio/device` feature (cpal), which `--all-features` turns on.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  # Keep in step with `rust-version` in Cargo.toml.
  MSRV: "1.88"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    # Off for now (owner, 2026-11-06); set back to run by removing this line.
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: The umbrella crate with no default features
        run: cargo clippy -p torque --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is off for now (owner, 2026-11-06): `os: [ubuntu-latest, windows-latest]` turns it back on.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - name: Tests (the whole workspace)
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --all-features --no-fail-fast
      - name: Doc tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --doc
      - name: Tests (the crates with platform-dependent behavior)
        if: runner.os == 'Windows'
        run: >-
          cargo nextest run --all-features --no-fail-fast
          -p torque-client -p torque-server -p torque-resource -p torque-rooms -p torque-ts-vm
          -p torque-app -p torque-render-core -p torque-render-hd -p torque-audio
      - name: Examples
        shell: bash
        run: |
          for example in script shape collide net; do
            cargo run -p torque --example "$example"
          done

  docs:
    name: rustdoc and the guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: API reference
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: mdbook@0.5.2
      - name: The guide
        run: mdbook build book

  web-guard:
    name: browser check guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No script opens a browser except through the guard
        run: node web/guard-scan.mjs
      - name: A guarded page never gets the pointer lock
        run: |
          npm install --prefix web-tools --no-audit --no-fund --silent --save-exact puppeteer-core@24.43.1
          TORQUE_WEB_TOOLS="$PWD/web-tools" node web/guard.test.mjs

  msrv:
    name: MSRV
    # Off for now (owner, 2026-11-06); set back to run by removing this line.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
