# Continuous integration: formatting, lints, tests, examples, API docs, the script reference, the guide, the MSRV and the dependency policy.
#
# Every third-party action is pinned to a full commit SHA (the tag it was taken from is in the comment); update them
# together.
#
# Off for now (owner, 2026-11-06): the Windows tests (the test matrix) and the Windows clippy run (the clippy matrix).
#
# Platforms: lints and everything else run on Linux only (Windows is off, see above), except the tests: Linux runs the
# whole workspace (and its doc tests), Windows (when on) only the crates whose behavior depends on the platform
# (sockets, the window and input, files, the GPU through WARP, audio, the room service, the script VM's file rules). The
# other crates are pure logic the Linux run already covers, and the example games' long headless runs stay on Linux.
# Tests run under cargo-nextest, which runs the test binaries in parallel.
#
# GPU crates: crates that draw through wgpu build and lint on both runners (wgpu compiles without a GPU). Their tests
# that need an adapter get Mesa's software Vulkan driver (lavapipe, `mesa-vulkan-drivers`) on Linux and WARP on Windows;
# a test that finds no adapter returns early instead of failing, so neither the crates nor the workflow need an
# `--exclude` or a feature switch for a headless runner.
#
# The browser check guard (web/guard.mjs) is scanned and tested on Linux, where the runner has Chrome.
#
# The determinism check (web/trace-hash.mjs) runs the trace-hash scenarios natively and as wasm32-wasip1 under Node's WASI and
# compares what they print: the predicted paths must be bit-exact on both.
#
# Linux also needs the ALSA headers for the `torque-audio/device` feature (cpal), which `--all-features` turns on.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  # Keep in step with `rust-version` in Cargo.toml.
  MSRV: "1.99"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is off for now (owner, 2026-11-06): `os: [ubuntu-latest, windows-latest]` turns it back on.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: The umbrella crate with no default features
        run: cargo clippy -p torque --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.partition }}/3)
    strategy:
      fail-fast: false
      matrix:
        # Windows is off for now (owner, 2026-11-06): `os: [ubuntu-latest, windows-latest]` turns it back on.
        os: [ubuntu-latest]
        # The tests in three jobs that run side by side (nextest's `--partition`); each builds the workspace from the
        # same cache.
        partition: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev mesa-vulkan-drivers fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - name: Tests (the whole workspace)
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --all-features --no-fail-fast --partition hash:${{ matrix.partition }}/3
      - name: Doc tests
        if: runner.os == 'Linux' && matrix.partition == 1
        run: cargo test --workspace --all-features --doc
      - name: Tests (the crates with platform-dependent behavior)
        if: runner.os == 'Windows'
        run: >-
          cargo nextest run --all-features --no-fail-fast --partition hash:${{ matrix.partition }}/3
          -p torque-client -p torque-server -p torque-resource -p torque-rooms -p torque-ts-vm
          -p torque-app -p torque-render-core -p torque-render-hd -p torque-audio
      - name: Examples
        if: matrix.partition == 1
        shell: bash
        run: |
          for example in script shape collide net; do
            cargo run -p torque --example "$example"
          done

  # The test job runs the engine's own protocol, the plugin groups' default. Torque's protocol is an opt-in a game keeps, so
  # its half of the network matrix (the `net-matrix` recipe) runs here: the suites that follow the protocol, the rope's TGE client,
  # the wire goldens and the natives lists, and the examples' headless runs.
  tge-protocol:
    name: test (Torque's protocol)
    runs-on: ubuntu-latest
    env:
      TORQUE_NET_PROTOCOL: tge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev mesa-vulkan-drivers fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - name: The network matrix's suites in Torque's protocol
        run: >-
          cargo nextest run --all-features --no-fail-fast
          -p torque-example-minimal -p torque-example-minimal-engine -p torque-example-character
          -p torque-example-level-demo -p torque-example-fps -p torque-example-vehicle-demo -p torque-example-mods-demo
          -p torque-plugin-rope -p torque-mods -p torque-plugin-props -p torque-trace-hash -p torque-app-server
      - name: The TGE goldens and the natives lists
        run: |
          cargo nextest run --all-features -p torque-net --test tge_golden
          cargo nextest run --all-features -p torque-app --test natives
      - name: The examples' headless runs
        shell: bash
        run: |
          for example in script shape collide net; do
            cargo run -p torque --example "$example"
          done
          cargo run -p torque-example-minimal --bin min-server -- --port 0 --ticks 64

  docs:
    name: rustdoc, the script reference and the guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: API reference
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: mdbook@0.5.2
      - name: The script reference is up to date
        run: |
          cargo run -p torque-script-reference
          git add --intent-to-add book/src/reference
          git diff --exit-code book/src/reference
      - name: The guide
        run: mdbook build book
      - name: The C header of the native extension ABI is up to date
        run: cargo run --manifest-path crates/torque-plugin-abi/header-gen/Cargo.toml -- --check

  server-deps:
    name: the server crate has no drawing, GUI, audio or window crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - name: The dependency tree of torque-app-server (every feature)
        shell: bash
        run: |
          cargo tree -p torque-app-server --all-features --prefix none | sed 's/ v[0-9].*//' | sort -u > server-tree.txt
          cat server-tree.txt
          if grep -E '^(wgpu|winit|naga|cpal|raw-window-handle|torque-(render|gui|audio|client|fonts))' server-tree.txt; then
            echo "torque-app-server depends on the crates above" >&2
            exit 1
          fi

  web-guard:
    name: browser check guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No script opens a browser except through the guard
        run: node web/guard-scan.mjs
      - name: A guarded page never gets the pointer lock
        run: |
          npm install --prefix web-tools --no-audit --no-fund --silent --save-exact puppeteer-core@24.43.1
          # The runner cannot use Chrome's sandbox; the guard drops it only when asked.
          TORQUE_CHROME_NO_SANDBOX=1 TORQUE_WEB_TOOLS="$PWD/web-tools" node web/guard.test.mjs

  trace-hash:
    name: trace hash (native = wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The same command as `just trace-hash`: the scenarios' hashes natively (twice) and as wasm32-wasip1 under Node's WASI.
      - name: The 600-tick trace hashes of the predicted paths, native and wasm
        run: node web/trace-hash.mjs

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
